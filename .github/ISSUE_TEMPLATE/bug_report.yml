name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Output of `backupthing check`
      description: Lists your tool versions and working encoders. Remove anything you consider private.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Backupthing version
      description: Output of `backupthing --version`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: "`journalctl --user -u backupthing` or the terminal output. Remove file names you consider private."
      render: text
  - type: input
    id: os
    attributes:
      label: Distribution and GPU
      placeholder: e.g. Arch Linux, NVIDIA RTX 3060
